[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "backupcheck"
version = "0.1.0"
description = "Verify a backup tree file by file, and measure what size-only checking misses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "backupcheck contributors" }]
keywords = ["backup", "verification", "sha256", "integrity", "corruption"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Java",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = []

[project.scripts]
backupcheck = "backupcheck.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/backupcheck"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
